server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;

  # Content-Security-Policy
  # - 'self' + 'unsafe-inline' for style-src: Vite/React inject inline styles.
  # - 'unsafe-inline' for script-src: kept for the Vite-built bundle; must be addressed
  #   in a follow-up by migrating to CSP nonces with the Vite build.
  # - Fonts and icons (Cairo, IBM Plex Arabic, Noto Kufi Arabic, Font Awesome) are now
  #   bundled and self-hosted (see frontend/src/main.tsx) — no external font-src/style-src
  #   CDN allowance is needed any more; keeping it here would just widen the attack
  #   surface for no benefit.
  # - connect-src is restricted to 'self' (same-origin). If the API and frontend are on
  #   different domains, configure the exact API origin via environment variable at deploy time.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Strict-Transport-Security (only meaningful over HTTPS, e.g. behind a TLS-terminating proxy/CDN)
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  # Permissions-Policy: disable powerful browser features this app doesn't use
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
}
